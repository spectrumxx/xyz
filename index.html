<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexStore</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050810;
      --bg2: #080d1a;
      --card: #0c1220;
      --border: #1a2540;
      --cyan: #00f0ff;
      --cyan2: #00c8d4;
      --blue: #0066ff;
      --purple: #7000ff;
      --text: #c8d8f0;
      --text2: #5a7090;
      --green: #00ff88;
      --red: #ff3060;
      --glow: 0 0 20px rgba(0,240,255,0.3);
      --glow2: 0 0 40px rgba(0,240,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* GRID BG */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 60% 20%, rgba(0,102,255,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 20% 80%, rgba(112,0,255,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5,8,16,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      position: relative;
    }

    .logo::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--cyan), transparent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #adminBtn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      padding: 7px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #adminBtn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    #addBtn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      color: #000;
      font-size: 22px;
      font-weight: 300;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0,240,255,0.4);
      transition: all 0.2s;
      line-height: 1;
    }
    #addBtn:hover {
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 0 30px rgba(0,240,255,0.6);
    }

    /* TABS */
    .tabs-bar {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 0;
      padding: 20px 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 12px 28px;
      background: transparent;
      border: none;
      color: var(--text2);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }

    .tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--cyan);
      transform: scaleX(0);
      transition: transform 0.2s;
      box-shadow: var(--glow);
    }

    .tab.active {
      color: var(--cyan);
    }

    .tab.active::after {
      transform: scaleX(1);
    }

    .tab:hover { color: var(--text); }

    /* MAIN */
    main {
      position: relative;
      z-index: 1;
      padding: 32px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* SECTION HEADER */
    .section-label {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--text2);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      animation: fadeIn 0.4s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      border-color: rgba(0,240,255,0.4);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(0,240,255,0.1);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #0d1830, #1a2540);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-thumb .no-img {
      font-size: 52px;
      opacity: 0.5;
    }

    .card-type-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 7px;
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      color: var(--cyan);
      letter-spacing: 1px;
    }

    .card-info {
      padding: 12px;
    }

    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #e0eeff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* EMPTY STATE */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text2);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty p {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 3px;
    }

    /* LOADING */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text2);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .overlay.open { display: flex; }

    /* MODAL */
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }

    .modal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--purple));
    }

    .modal-header {
      padding: 24px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--cyan);
    }

    .modal-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover { border-color: var(--red); color: var(--red); }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* FORM */
    .field { display: flex; flex-direction: column; gap: 6px; }

    .field label {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text2);
    }

    .field input,
    .field textarea,
    .field select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(0,240,255,0.08);
    }

    .field textarea { resize: vertical; min-height: 80px; }

    .field select option { background: var(--card); }

    /* FILE UPLOAD */
    .file-zone {
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .file-zone:hover, .file-zone.drag { border-color: var(--cyan); background: rgba(0,240,255,0.03); }

    .file-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-zone-icon { font-size: 28px; margin-bottom: 8px; }

    .file-zone-text {
      font-size: 13px;
      color: var(--text2);
      letter-spacing: 1px;
    }

    .file-zone-name {
      font-size: 13px;
      color: var(--cyan);
      margin-top: 6px;
      word-break: break-all;
    }

    /* PROGRESS */
    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.show { display: block; }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* BUTTONS */
    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      color: #000;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px 28px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 20px rgba(0,240,255,0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 24px rgba(0,240,255,0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover { border-color: var(--text2); color: var(--text); }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 0 24px 24px;
    }

    /* DOWNLOAD MODAL */
    .dl-modal {
      max-width: 400px;
    }

    .dl-thumb {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0d1830, #1a2540);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .dl-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .dl-title {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
    }

    .dl-desc {
      font-size: 14px;
      color: var(--text2);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .dl-meta {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .dl-badge {
      background: rgba(0,240,255,0.08);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 4px;
      padding: 4px 12px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: 1px;
    }

    /* LOGIN MODAL */
    .login-msg {
      font-size: 13px;
      color: var(--text2);
      text-align: center;
      margin-bottom: 4px;
    }

    /* STATUS MSG */
    .status-msg {
      font-size: 13px;
      text-align: center;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }

    .status-msg.error { display: block; background: rgba(255,48,96,0.1); color: var(--red); border: 1px solid rgba(255,48,96,0.2); }
    .status-msg.success { display: block; background: rgba(0,255,136,0.1); color: var(--green); border: 1px solid rgba(0,255,136,0.2); }

    /* TRENDING BADGE */
    .trending .card-type-badge {
      background: rgba(255,160,0,0.15);
      border-color: rgba(255,160,0,0.3);
      color: #ffa000;
    }

    /* SCROLL */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      main { padding: 20px 16px; }
      .tabs-bar { padding: 16px 16px 0; }
      .tab { padding: 10px 16px; font-size: 10px; }
      header { padding: 0 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">NEXSTORE</div>
  <div class="header-right">
    <button id="adminBtn">⚙ ADMIN</button>
    <button id="addBtn" title="Publicar">+</button>
  </div>
</header>

<!-- TABS -->
<div class="tabs-bar">
  <button class="tab active" data-tab="apps">Apps</button>
  <button class="tab" data-tab="games">Jogos</button>
  <button class="tab" data-tab="trending">Em Alta</button>
</div>

<!-- MAIN -->
<main>
  <div class="section-label" id="sectionLabel">APLICATIVOS</div>
  <div class="grid" id="grid">
    <div class="loading">
      <div class="spinner"></div>
      <div style="font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;">CARREGANDO...</div>
    </div>
  </div>
</main>

<!-- OVERLAY -->
<div class="overlay" id="overlay">

  <!-- LOGIN MODAL -->
  <div class="modal" id="loginModal">
    <div class="modal-header">
      <span class="modal-title">ACESSO ADMIN</span>
      <button class="modal-close" onclick="closeAll()">✕</button>
    </div>
    <div class="modal-body">
      <p class="login-msg">Área restrita. Entre com suas credenciais.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@email.com" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <div class="status-msg" id="loginStatus"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeAll()">Cancelar</button>
      <button class="btn-primary" onclick="doLogin()">ENTRAR</button>
    </div>
  </div>

  <!-- PUBLISH MODAL -->
  <div class="modal" id="publishModal" style="display:none">
    <div class="modal-header">
      <span class="modal-title">NOVA PUBLICAÇÃO</span>
      <button class="modal-close" onclick="closeAll()">✕</button>
    </div>
    <div class="modal-body">

      <div class="field">
        <label>Tipo</label>
        <select id="pubType">
          <option value="">Selecione o tipo</option>
          <option value="apk">.APK</option>
          <option value="apks">.APKS</option>
          <option value="xapk">.XAPK</option>
        </select>
      </div>

      <div class="field">
        <label>Categoria</label>
        <select id="pubCategory">
          <option value="app">Aplicativo</option>
          <option value="game">Jogo</option>
        </select>
      </div>

      <div class="field">
        <label>Arquivo (.apk / .apks / .xapk)</label>
        <div class="file-zone" id="fileZone">
          <input type="file" id="fileInput" accept=".apk,.apks,.xapk" onchange="onFileChange(this)" />
          <div class="file-zone-icon">📦</div>
          <div class="file-zone-text">Clique ou arraste o arquivo</div>
          <div class="file-zone-name" id="fileName"></div>
        </div>
      </div>

      <div class="field">
        <label>Título (opcional)</label>
        <input type="text" id="pubTitle" placeholder="Nome do app ou jogo" />
      </div>

      <div class="field">
        <label>Descrição (opcional)</label>
        <textarea id="pubDesc" placeholder="Descreva brevemente..."></textarea>
      </div>

      <div class="field">
        <label>Imagem/Ícone (opcional)</label>
        <div class="file-zone" id="imgZone">
          <input type="file" id="imgInput" accept="image/*" onchange="onImgChange(this)" />
          <div class="file-zone-icon">🖼️</div>
          <div class="file-zone-text">Selecione uma imagem</div>
          <div class="file-zone-name" id="imgName"></div>
        </div>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="status-msg" id="pubStatus"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeAll()">Cancelar</button>
      <button class="btn-primary" id="publishBtn" onclick="doPublish()">PUBLICAR</button>
    </div>
  </div>

  <!-- DOWNLOAD MODAL -->
  <div class="modal dl-modal" id="downloadModal" style="display:none">
    <div class="modal-header" style="padding-bottom:20px">
      <span class="modal-title">DOWNLOAD</span>
      <button class="modal-close" onclick="closeAll()">✕</button>
    </div>
    <div class="modal-body" style="align-items:center;text-align:center">
      <div class="dl-thumb" id="dlThumb">📦</div>
      <div class="dl-title" id="dlTitle">-</div>
      <div class="dl-desc" id="dlDesc"></div>
      <div class="dl-meta">
        <span class="dl-badge" id="dlType">APK</span>
        <span class="dl-badge" id="dlCat">APP</span>
      </div>
    </div>
    <div class="modal-footer" style="justify-content:center;padding-bottom:24px">
      <button class="btn-secondary" onclick="closeAll()">Fechar</button>
      <button class="btn-primary" id="dlBtn" onclick="doDownload()">⬇ BAIXAR</button>
    </div>
  </div>

</div>

  setupDrag();
});

async function checkSession() {
  const { data } = await db.auth.getSession();
  if (data.session) setAdmin(true);
}

function setAdmin(v) {
  isAdmin = v;
  document.getElementById('addBtn').style.display = v ? 'flex' : 'none';
  document.getElementById('adminBtn').textContent = v ? '⏻ SAIR' : '⚙ ADMIN';
}

// ─────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────
const tabLabels = { apps: 'APLICATIVOS', games: 'JOGOS', trending: 'EM ALTA' };

function setupTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.dataset.tab;
      document.getElementById('sectionLabel').textContent = tabLabels[currentTab];
      loadTab(currentTab);
    });
  });
}

// ─────────────────────────────────────────────
// LOAD
// ─────────────────────────────────────────────
async function loadTab(tab) {
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="loading"><div class="spinner"></div><div style="font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;">CARREGANDO...</div></div>`;

  let query = db.from('items').select('*').order('created_at', { ascending: false });

  if (tab === 'apps') query = query.eq('category', 'app');
  else if (tab === 'games') query = query.eq('category', 'game');
  else if (tab === 'trending') query = query.order('downloads', { ascending: false }).limit(20);

  const { data, error } = await query;

  if (error) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠</div><p>ERRO AO CARREGAR</p></div>`;
    return;
  }

  renderGrid(data, tab === 'trending');
}

function renderGrid(items, trending = false) {
  const grid = document.getElementById('grid');
  if (!items || items.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>NENHUM ITEM PUBLICADO</p></div>`;
    return;
  }

  grid.innerHTML = '';
  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (trending ? ' trending' : '');
    card.style.animationDelay = `${i * 0.05}s`;

    const thumb = item.image_url
      ? `<img src="${item.image_url}" alt="${item.title}" />`
      : `<span class="no-img">${item.category === 'game' ? '🎮' : '📱'}</span>`;

    card.innerHTML = `
      <div class="card-thumb">
        ${thumb}
        <span class="card-type-badge">.${item.file_type.toUpperCase()}</span>
      </div>
      <div class="card-info">
        <div class="card-title">${item.title || 'Sem título'}</div>
        <div class="card-desc">${item.description || ''}</div>
      </div>
    `;

    card.addEventListener('click', () => openDownload(item));
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────
// DOWNLOAD MODAL
// ─────────────────────────────────────────────
function openDownload(item) {
  currentItem = item;
  const thumb = document.getElementById('dlThumb');
  if (item.image_url) {
    thumb.innerHTML = `<img src="${item.image_url}" alt="${item.title}" />`;
  } else {
    thumb.textContent = item.category === 'game' ? '🎮' : '📱';
  }
  document.getElementById('dlTitle').textContent = item.title || 'Sem título';
  document.getElementById('dlDesc').textContent = item.description || '';
  document.getElementById('dlType').textContent = `.${item.file_type.toUpperCase()}`;
  document.getElementById('dlCat').textContent = item.category === 'game' ? 'JOGO' : 'APP';
  showModal('downloadModal');
}

async function doDownload() {
  if (!currentItem) return;

  await db.from('items').update({ downloads: (currentItem.downloads || 0) + 1 }).eq('id', currentItem.id);

  const { data } = db.storage.from('files').getPublicUrl(currentItem.file_path);
  window.open(data.publicUrl, '_blank');
}

// ─────────────────────────────────────────────
// ADMIN / LOGIN
// ─────────────────────────────────────────────
document.getElementById('adminBtn').addEventListener('click', async () => {
  if (isAdmin) {
    await db.auth.signOut();
    setAdmin(false);
  } else {
    showModal('loginModal');
  }
});

document.getElementById('addBtn').addEventListener('click', () => {
  resetPublishForm();
  showModal('publishModal');
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPassword').value;
  const status = document.getElementById('loginStatus');

  status.className = 'status-msg';
  status.textContent = '';

  const { error } = await db.auth.signInWithPassword({ email, password: pass });

  if (error) {
    status.className = 'status-msg error';
    status.textContent = 'Email ou senha incorretos.';
    return;
  }

  setAdmin(true);
  closeAll();
}

// ─────────────────────────────────────────────
// FILE INPUTS
// ─────────────────────────────────────────────
function onFileChange(input) {
  const file = input.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['apk','apks','xapk'].includes(ext)) {
    alert('Tipo inválido! Use .apk, .apks ou .xapk');
    input.value = '';
    return;
  }
  selectedFile = file;
  document.getElementById('fileName').textContent = file.name;

  if (!document.getElementById('pubType').value) {
    document.getElementById('pubType').value = ext;
  }
  if (!document.getElementById('pubTitle').value) {
    document.getElementById('pubTitle').value = file.name.replace(/\.(apk|apks|xapk)$/i, '');
  }
}

function onImgChange(input) {
  const file = input.files[0];
  if (!file) return;
  selectedImg = file;
  document.getElementById('imgName').textContent = file.name;
}

function setupDrag() {
  ['fileZone','imgZone'].forEach(id => {
    const zone = document.getElementById(id);
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (!file) return;
      if (id === 'fileZone') {
        document.getElementById('fileInput').files = e.dataTransfer.files;
        onFileChange(document.getElementById('fileInput'));
      } else {
        document.getElementById('imgInput').files = e.dataTransfer.files;
        onImgChange(document.getElementById('imgInput'));
      }
    });
  });
}

// ─────────────────────────────────────────────
// PUBLISH
// ─────────────────────────────────────────────
async function doPublish() {
  const type = document.getElementById('pubType').value;
  const category = document.getElementById('pubCategory').value;
  const title = document.getElementById('pubTitle').value.trim();
  const desc = document.getElementById('pubDesc').value.trim();
  const status = document.getElementById('pubStatus');
  const btn = document.getElementById('publishBtn');
  const progress = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');

  status.className = 'status-msg';

  if (!type) { showStatus(status, 'error', 'Selecione o tipo do arquivo.'); return; }
  if (!selectedFile) { showStatus(status, 'error', 'Selecione um arquivo.'); return; }

  btn.disabled = true;
  progress.classList.add('show');
  fill.style.width = '10%';

  try {
    const ts = Date.now();
    const filePath = `files/${ts}_${selectedFile.name.replace(/\s/g,'_')}`;

    fill.style.width = '30%';

    const { error: uploadErr } = await dbAdmin.storage.from('files').upload(filePath, selectedFile, { upsert: false });
    if (uploadErr) throw uploadErr;

    fill.style.width = '60%';

    let imagePath = null;
    if (selectedImg) {
      const imgPath = `images/${ts}_${selectedImg.name.replace(/\s/g,'_')}`;
      const { error: imgErr } = await dbAdmin.storage.from('files').upload(imgPath, selectedImg, { upsert: false });
      if (!imgErr) {
        const { data: imgUrl } = dbAdmin.storage.from('files').getPublicUrl(imgPath);
        imagePath = imgUrl.publicUrl;
      }
    }

    fill.style.width = '80%';

    const { error: dbErr } = await dbAdmin.from('items').insert({
      title: title || selectedFile.name.replace(/\.(apk|apks|xapk)$/i,''),
      description: desc || null,
      file_type: type,
      category,
      file_path: filePath,
      image_url: imagePath,
      downloads: 0
    });

    if (dbErr) throw dbErr;

    fill.style.width = '100%';
    showStatus(status, 'success', 'Publicado com sucesso!');

    setTimeout(() => {
      closeAll();
      loadTab(currentTab);
    }, 1200);

  } catch (err) {
    showStatus(status, 'error', 'Erro: ' + (err.message || 'Tente novamente.'));
    btn.disabled = false;
    progress.classList.remove('show');
  }
}

function resetPublishForm() {
  selectedFile = null;
  selectedImg = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('imgInput').value = '';
  document.getElementById('fileName').textContent = '';
  document.getElementById('imgName').textContent = '';
  document.getElementById('pubType').value = '';
  document.getElementById('pubCategory').value = 'app';
  document.getElementById('pubTitle').value = '';
  document.getElementById('pubDesc').value = '';
  document.getElementById('pubStatus').className = 'status-msg';
  document.getElementById('progressBar').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('publishBtn').disabled = false;
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function showModal(id) {
  document.getElementById('overlay').classList.add('open');
  ['loginModal','publishModal','downloadModal'].forEach(m => {
    document.getElementById(m).style.display = m === id ? 'block' : 'none';
  });
}

function closeAll() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeAll();
});

function showStatus(el, type, msg) {
  el.className = 'status-msg ' + type;
  el.textContent = msg;
}
</script>
</body>
</html>
